name: SimpleATH Tahoe Intel source validation

# Strict source validation, invoked ONLY by ci tags or a release workflow.
# Build tags do not run CI, and no failure is ever reclassified as a pass.
on:
  push:
    tags:
      - 'ci'
      - 'ci-*'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: simpleath-ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate:
    name: Full macOS source validation
    if: github.event.repository.private == false
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use current stable Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Set up precompiled uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      # Intel macOS wheels are available for every pinned tool. Never invoke
      # Homebrew or build source dependencies on this unsupported architecture.
      - name: Install precompiled source-validation tools with uv
        run: |
          uv pip install --system --python python3 --no-cache \
            --only-binary :all: \
            clang-format==22.1.8 clang-tidy==22.1.8 \
            ruff==0.17.4 basedpyright==1.40.2 \
            nodejs-wheel-binaries==24.19.0

      - name: Verify Intel Tahoe toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sw_vers
          xcodebuild -version
          python3 --version
          clang++ --version
          clang-format --version
          clang-tidy --version
          ruff --version
          basedpyright --version

      - name: Select native Apple macOS SDK
        shell: bash
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$sdk/usr/include" || {
            echo '::error::Native Apple macOS SDK headers unavailable'
            exit 1
          }
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"

      - name: Refresh checkout-local Clang-Tidy commands
        run: python3 -B tools/generate_compile_commands.py

      - name: Validate every source and offline host test
        id: source_validation
        env:
          RUFF_NO_CACHE: '1'
        run: python3 -B tools/validate.py --no-cache --stdout-only
