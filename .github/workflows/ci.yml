name: SimpleATH Tahoe Intel source validation

# Standalone CI tags retain strict failure; owner-authorized builds request
# advisory validation (warnings rather than a build prerequisite).
on:
  push:
    tags:
      - 'ci'
      - 'ci-*'
  workflow_call:
    inputs:
      advisory:
        description: Report validation failures without blocking builds
        type: boolean
        required: false
        default: false
    outputs:
      validation_outcome:
        description: Actual status of strict source validation
        value: ${{ jobs.validate.outputs.validation_outcome }}

permissions:
  contents: read

concurrency:
  group: simpleath-ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate:
    name: Full macOS source validation
    if: github.event.repository.private == false
    runs-on: macos-26-intel
    timeout-minutes: 60
    outputs:
      validation_outcome: ${{ steps.source_validation.outcome }}
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use current stable Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install current Clang and Python lint tools
        run: |
          brew update
          brew install llvm ruff basedpyright
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify Intel Tahoe toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sw_vers
          xcodebuild -version
          python3 --version
          clang++ --version
          clang-format --version
          clang-tidy --version
          ruff --version
          basedpyright --version

      - name: Prepare the checked-in kernel compatibility SDK
        run: python3 -B tools/bootstrap_sdk.py

      - name: Refresh checkout-local Clang-Tidy commands
        run: python3 -B tools/generate_compile_commands.py

      - name: Validate every source and offline host test
        id: source_validation
        continue-on-error: ${{ inputs.advisory == true }}
        env:
          CPATH: ${{ github.workspace }}/.references/MacKernelSDK/Headers
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          python3 -B tools/validate.py --no-cache

      - name: Warn about advisory source validation failure
        if: ${{ always() && inputs.advisory && steps.source_validation.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning title=Source validation failed::The checked-in validator reported errors; this is advisory for authorized builds only.'
          {
            echo '### Advisory validation findings'
            echo 'Source validation failed. Review the uploaded report.json.'
            echo 'Standalone ci tags remain strict and fail on the same findings.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failed or successful validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SimpleATH-macOS-validation-${{ github.run_id }}
          path: .cache/validate/report.json
          if-no-files-found: warn
          retention-days: 1
