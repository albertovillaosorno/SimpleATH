name: Build

# Only a user-authorized build-v* tag may compile the kext.
on:
  push:
    tags:
      - 'build-v*'

permissions:
  contents: read

concurrency:
  group: simpleath-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build authorized x86_64 kext (no CI)
    # This event compiles only. `ci` and `release-v*` have separate triggers.
    if: >-
      !cancelled() &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/tags/build-v')
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - name: Checkout exact authorized commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enforce authorized CalVer tag
        shell: bash
        env:
          BUILD_TAG: ${{ github.ref_name }}
        run: python3 -B tools/build_tag.py "$BUILD_TAG"

      - name: Verify Intel Tahoe toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sw_vers
          xcodebuild -version

      - name: Verify native Apple kernel and C++ headers before Xcode
        shell: bash
        id: native_headers
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          builtin="$(xcrun clang++ -print-resource-dir)/include"
          kernel="$sdk/System/Library/Frameworks/Kernel.framework/Headers"
          for header in "$builtin/stddef.h" "$builtin/stdint.h" \
                        "$kernel/IOKit/IOLib.h"; do
            test -f "$header" || {
              echo "::error::Missing native Apple header: $header"
              exit 1
            }
          done
          test -d "$builtin" && test -d "$sdk/usr/include"
          printf '#include <stddef.h>\n#include <stdint.h>\n' | \
            xcrun clang++ -x c++ -std=c++14 -mkernel -nostdinc \
              -isystem "$builtin" -isystem "$kernel" \
              -isystem "$sdk/usr/include" -fsyntax-only -
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"
          echo "builtin=$builtin" >> "$GITHUB_OUTPUT"

      - name: Test Tahoe ABI inheritance against native Apple SDK
        # This narrow C++ syntax preflight is part of build compilation,
        # never the separate source CI job and never a kext link.
        run: python3 -B -m unittest -q tests.test_tahoe_native_sdk_abi

      - name: Reject unavailable Apple80211 private SDK headers
        # The SDK omits these declarations; local fixed ABI values are
        # required and compiled with freestanding Clang in this regression.
        run: python3 -B -m unittest -q tests.test_tahoe_apple80211_sdk_headers

      - name: Verify native metaclass allocator signatures and SDK syntax
        # XNU OSDefineDefaultStructors emits class-specific new/delete;
        # compile the actual native translation units before Xcode begins.
        run: python3 -B -m unittest -q tests.test_native_metaclass_allocation

      - name: Build unsigned x86_64 kernel extension
        run: |
          sdk="${{ steps.native_headers.outputs.sdk }}"
          kernel="${{ steps.native_headers.outputs.kernel }}"
          builtin="${{ steps.native_headers.outputs.builtin }}"
          xcodebuild \
            -project src/platform/SimpleATH.xcodeproj \
            -target SimpleATH \
            -configuration Release \
            SYMROOT="$PWD/build/Products" \
            OBJROOT="$PWD/build/Objects" \
            ARCHS=x86_64 \
            HEADER_SEARCH_PATHS="$PWD/src" \
            SYSTEM_HEADER_SEARCH_PATHS="$builtin $kernel $sdk/usr/include" \
            KERNEL_EXTENSION_HEADER_SEARCH_PATHS="$kernel" \
            KERNEL_FRAMEWORK_HEADERS="$kernel" \
            CODE_SIGNING_ALLOWED=NO \
            build > build-xcode.log 2>&1 || {
              tail -n 110 build-xcode.log
              exit 1
            }
          tail -n 18 build-xcode.log

      - name: Verify actual build bundle
        shell: bash
        run: |
          test -s build/Products/Release/SimpleATH.kext/Contents/MacOS/SimpleATH
          file build/Products/Release/SimpleATH.kext/Contents/MacOS/SimpleATH
          plutil -p build/Products/Release/SimpleATH.kext/Contents/Info.plist
          test -d build/Products/Release/SimpleATH.kext.dSYM
          xcrun dwarfdump --uuid build/Products/Release/SimpleATH.kext/Contents/MacOS/SimpleATH | awk '$1 == "UUID:" {print $2, $3}' > kernel-uuid.txt
          xcrun dwarfdump --uuid build/Products/Release/SimpleATH.kext.dSYM | awk '$1 == "UUID:" {print $2, $3}' > symbols-uuid.txt
          test -s kernel-uuid.txt
          test -s symbols-uuid.txt
          diff -u kernel-uuid.txt symbols-uuid.txt

      - name: Preserve kernel build artifacts and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SimpleATH-Intel-${{ github.ref_name }}
          path: |
            build/Products/Release/SimpleATH.kext/**
            build/Products/Release/SimpleATH.kext.dSYM/**
            kernel-uuid.txt
            symbols-uuid.txt
            build-xcode.log
          if-no-files-found: warn
          retention-days: 1
