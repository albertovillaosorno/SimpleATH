name: SimpleATH Xcode Compile

# A build requires an explicitly pushed build-v* tag.
# Ordinary branch pushes, pull requests, releases, and manual dispatches do not trigger CI.
on:
  push:
    tags:
      - 'build-v*'

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/build-v')
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: Validate source and native ABI
        run: |
          python3 Tools/check.py
          python3 Tools/native_references.py verify
      - name: Prepare dependencies
        run: python3 Tools/bootstrap.py
      - name: Build minimal bootstrap Release (one native IOKit source)
        run: |
          xcodebuild -project SimpleATH.xcodeproj -scheme SimpleATH -configuration Release -derivedDataPath build/DerivedData -arch x86_64 CODE_SIGNING_ALLOWED=NO build
      - name: Upload compiled kernel extension and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleATH-Xcode-Build
          path: |
            build/DerivedData/Build/Products/Release/SimpleATH.kext/**
            build/*.log
            build/*.json
          if-no-files-found: warn
