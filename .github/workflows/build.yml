name: SimpleATH Tahoe Intel authorized kernel build

# Only a user-authorized build-v* tag may compile the kext.
on:
  push:
    tags:
      - 'build-v*'

permissions:
  contents: read

concurrency:
  group: simpleath-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Advisory macOS source validation
    if: github.event.repository.private == false
    uses: ./.github/workflows/ci.yml
    with:
      advisory: true

  build:
    name: Build authorized x86_64 kext (CI advisory)
    needs: validate
    # A failed/missing macOS CI environment must not block an authorized
    # build. !cancelled() prevents a manually canceled run from proceeding.
    if: >-
      !cancelled() &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/tags/build-v')
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - name: Warn when pre-build validation did not succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          VALIDATION_CHECK_OUTCOME: ${{ needs.validate.outputs.validation_outcome }}
        shell: bash
        run: |
          if [ "$VALIDATION_RESULT" != success ] || [ "$VALIDATION_CHECK_OUTCOME" != success ]; then
            echo "::warning title=Advisory CI validation::CI job: $VALIDATION_RESULT; strict checks: $VALIDATION_CHECK_OUTCOME. Continuing authorized build; inspect the validation report if available."
            {
              echo '### Advisory macOS validation'
              echo "CI job: **$VALIDATION_RESULT**; strict checks: **$VALIDATION_CHECK_OUTCOME**."
              echo 'The owner authorized build continuation despite incomplete or failed CI.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce authorized numeric date-time tag
        shell: bash
        env:
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          import os
          import re

          tag = os.environ["BUILD_TAG"]
          if re.fullmatch(r"build-v[0-9]{4}(?:\.[0-9]{2}){4}", tag) is None:
              raise SystemExit("Build tag must be build-vYYYY.MM.DD.HH.mm")
          try:
              datetime.strptime(tag[len("build-v"):], "%Y.%m.%d.%H.%M")
          except ValueError as exc:
              raise SystemExit("Build tag contains an invalid date/time") from exc
          PY

      - name: Checkout exact authorized commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Intel Tahoe toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sw_vers
          xcodebuild -version

      - name: Prepare checked-in pinned kernel SDK
        run: python3 tools/bootstrap_sdk.py

      - name: Build unsigned x86_64 kernel extension
        run: |
          kernel_sdk="$PWD/.references/MacKernelSDK"
          xcodebuild \
            -project src/platform/SimpleATH.xcodeproj \
            -target SimpleATH \
            -configuration Release \
            SYMROOT="$PWD/build/Products" \
            OBJROOT="$PWD/build/Objects" \
            ARCHS=x86_64 \
            HEADER_SEARCH_PATHS="$PWD/src $kernel_sdk/Headers" \
            KERNEL_EXTENSION_HEADER_SEARCH_PATHS="$kernel_sdk/Headers" \
            KERNEL_FRAMEWORK_HEADERS="$kernel_sdk/Headers" \
            LIBRARY_SEARCH_PATHS="$kernel_sdk/Library/x86_64" \
            CODE_SIGNING_ALLOWED=NO \
            build > build-xcode.log 2>&1 || {
              tail -n 110 build-xcode.log
              exit 1
            }
          tail -n 18 build-xcode.log

      - name: Verify actual build bundle
        shell: bash
        run: |
          test -s build/Products/Release/SimpleATH.kext/Contents/MacOS/SimpleATH
          file build/Products/Release/SimpleATH.kext/Contents/MacOS/SimpleATH
          plutil -p build/Products/Release/SimpleATH.kext/Contents/Info.plist
          test -d build/Products/Release/SimpleATH.kext.dSYM
          xcrun dwarfdump --uuid build/Products/Release/SimpleATH.kext/Contents/MacOS/SimpleATH | awk '$1 == "UUID:" {print $2, $3}' > kernel-uuid.txt
          xcrun dwarfdump --uuid build/Products/Release/SimpleATH.kext.dSYM | awk '$1 == "UUID:" {print $2, $3}' > symbols-uuid.txt
          test -s kernel-uuid.txt
          test -s symbols-uuid.txt
          diff -u kernel-uuid.txt symbols-uuid.txt

      - name: Preserve kernel build artifacts and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SimpleATH-Intel-${{ github.ref_name }}
          path: |
            build/Products/Release/SimpleATH.kext/**
            build/Products/Release/SimpleATH.kext.dSYM/**
            kernel-uuid.txt
            symbols-uuid.txt
            build-xcode.log
          if-no-files-found: warn
          retention-days: 1
