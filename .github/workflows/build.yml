name: SimpleATH Rust and Swift Validation

# User authorization is required before pushing a build-v* tag.
# Commits, branch pushes, pull requests, releases, and manual dispatch do not run CI.
on:
  push:
    tags:
      - 'build-v*'

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/build-v')
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Rust formatting and metadata
        run: |
          cargo fmt --all -- --check
          cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Rust checks and tests
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Swift diagnostics validation
        run: |
          cd swift
          swift build
          swift test
