name: SimpleATH v1 x86_64 kernel build

# Exactly one user-authorized build tag starts this workflow.
# Ordinary branch pushes, PRs and workflow_dispatch do not build anything.
on:
  push:
    tags:
      - 'build-v*'

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/build-v')
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Display native toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - name: Prepare pinned kernel SDK
        run: python3 tools/bootstrap_sdk.py
      - name: Build SimpleATH v1 kernel extension
        run: |
          xcodebuild \
            -project src/platform/SimpleATH.xcodeproj \
            -scheme SimpleATH \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -arch x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            build > build-xcode.log 2>&1 || {
              tail -n 110 build-xcode.log
              exit 1
            }
          tail -n 18 build-xcode.log
      - name: Verify actual build bundle
        run: |
          test -s build/DerivedData/Build/Products/Release/SimpleATH.kext/Contents/MacOS/SimpleATH
          file build/DerivedData/Build/Products/Release/SimpleATH.kext/Contents/MacOS/SimpleATH
          plutil -p build/DerivedData/Build/Products/Release/SimpleATH.kext/Contents/Info.plist
      - name: Upload kext and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleATH-v1-Intel
          path: |
            build/DerivedData/Build/Products/Release/SimpleATH.kext/**
            build-xcode.log
          if-no-files-found: warn
