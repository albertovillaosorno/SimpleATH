min_word_length = 3
schema = "https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json"
version = "0.2"

[dictionary.technical]
name = "simpleath-technical"
path = ".jig/cspell/technical.txt"
